<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Redirect all 404s to index.html while keeping the path
      var redirectTo = window.location.protocol + '//' + window.location.host + '/Profile/index.html';
      var pathname = window.location.pathname.replace('/Profile', '');
      window.location.replace(redirectTo + pathname + window.location.search + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
